<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="AppDespesas - Início"><span class="brand-mark">A</span><span>AppDespesas</span></a>
      <nav class="main-nav" aria-label="Navegação principal">
        <a class="nav-link active" href="/"><span>⌂</span> Início</a>
        <a class="nav-link" href="/categories"><span>▦</span> Categorias</a>
      </nav>
      <div class="sidebar-bottom"><span class="connection-dot"></span><span>Dados na nuvem</span></div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div><p class="eyebrow">CONTROLE FINANCEIRO PESSOAL</p><h1>Início</h1></div>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Alternar tema" title="Alternar tema">◐</button>
      </header>

      <section class="month-summary" aria-labelledby="month-label">
        <div><p class="muted" id="month-label">Gastos em <span id="current-month"></span></p><p class="month-total" id="month-total">R$ 0,00</p></div>
        <button class="primary-button" id="open-expense-form" type="button"><span aria-hidden="true">＋</span> Adicionar despesa</button>
      </section>

      <section class="recent-section">
        <div class="section-heading"><div><h2>Últimas despesas</h2><p class="muted">Seus lançamentos mais recentes neste mês.</p></div><a href="/docs#/expenses/get_api_expenses">Consultar despesas</a></div>
        <div class="expense-list" id="recent-expenses"><div class="empty-state">Carregando despesas...</div></div>
      </section>
      <p class="page-error" id="page-error" role="alert" hidden></p>
    </main>
  </div>

  <dialog class="expense-dialog" id="expense-dialog">
    <form id="expense-form" class="dialog-form">
      <div class="dialog-heading"><div><p class="eyebrow">NOVO LANÇAMENTO</p><h2>Adicionar despesa</h2></div><button class="icon-button" id="close-expense-form" type="button" aria-label="Fechar">×</button></div>
      <label>Descrição<input name="description" maxlength="160" required placeholder="Ex.: Supermercado"></label>
      <div class="form-grid">
        <label>Valor (R$)<input name="amount" type="number" min="0.01" step="0.01" required placeholder="0,00"></label>
        <label>Data<input name="expense_date" type="date" required></label>
      </div>
      <label>Categoria<select id="category-select" required><option value="">Selecione uma categoria</option></select></label>
      <label>Subcategoria<select name="subcategory_id" id="subcategory-select" required disabled><option value="">Selecione uma subcategoria</option></select></label>
      <label>Estabelecimento<input name="establishment_name" id="establishment-input" list="establishment-options" maxlength="120" required placeholder="Ex.: Assaí, farmácia, posto"><datalist id="establishment-options"></datalist></label>
      <label>Forma de pagamento<select name="payment_method_id" id="payment-method-select" required><option value="">Selecione uma forma de pagamento</option></select></label>
      <label>Observação <span class="optional">(opcional)</span><textarea name="notes" rows="2" placeholder="Detalhes adicionais"></textarea></label>
      <p class="form-error" id="form-error" role="alert" hidden></p>
      <div class="dialog-actions"><button class="secondary-button" id="cancel-expense-form" type="button">Cancelar</button><button class="primary-button" type="submit" id="save-expense">Salvar despesa</button></div>
    </form>
  </dialog>
  <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
</body>
</html>
